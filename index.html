<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Order Recap</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tt: { cyan: '#00f2fe', pink: '#fe0979', dark: '#121212' }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #0b0b0b;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at top left, rgba(0, 242, 254, 0.05), transparent 40%),
                radial-gradient(circle at bottom right, rgba(254, 9, 121, 0.05), transparent 40%);
            background-attachment: fixed;
        }
        .glass {
            background: rgba(25, 25, 25, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }
        
        /* 1. Efek Animasi Glitch Teks */
        .glitch-wrapper { position: relative; display: inline-block; }
        .glitch { position: relative; color: white; font-weight: bold; }
        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.8;
        }
        .glitch::before {
            left: 2px; text-shadow: -2px 0 #fe0979;
            animation: glitch-anim 2s infinite linear alternate-reverse;
        }
        .glitch::after {
            left: -2px; text-shadow: -2px 0 #00f2fe;
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim {
            0% { clip-path: inset(20% 0 80% 0); }
            20% { clip-path: inset(60% 0 10% 0); }
            40% { clip-path: inset(40% 0 50% 0); }
            60% { clip-path: inset(80% 0 5% 0); }
            80% { clip-path: inset(10% 0 70% 0); }
            100% { clip-path: inset(30% 0 20% 0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 60% 0); }
            20% { clip-path: inset(30% 0 20% 0); }
            40% { clip-path: inset(70% 0 10% 0); }
            60% { clip-path: inset(20% 0 50% 0); }
            80% { clip-path: inset(50% 0 30% 0); }
            100% { clip-path: inset(5% 0 80% 0); }
        }

        /* 2. Efek Pulse Glow untuk Tombol */
        .btn-glow {
            box-shadow: 0 0 15px rgba(254, 9, 121, 0.5);
            animation: pulse-glow 2s infinite;
        }
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 15px rgba(254, 9, 121, 0.5); }
            50% { box-shadow: 0 0 25px rgba(0, 242, 254, 0.6); }
            100% { box-shadow: 0 0 15px rgba(254, 9, 121, 0.5); }
        }

        /* 3. Efek Slide-in Item Pesanan */
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .animate-slide-in {
            animation: slideIn 0.4s ease-out forwards;
        }

        /* 4. Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        /* Toast Container */
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 50; display: flex; flex-direction: column; gap: 10px; }
        .toast {
            min-width: 250px; padding: 15px; border-radius: 8px; background: rgba(20,20,20,0.9);
            color: white; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); animation: slideIn 0.3s ease-out forwards;
        }
        .toast.hide { animation: fadeOut 0.3s ease-in forwards; }
        @keyframes fadeOut { to { opacity: 0; transform: translateX(50px); } }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <!-- Header & Stats -->
    <div class="w-full max-w-5xl mb-8">
        <div class="text-center mb-6">
            <h1 class="text-4xl md:text-5xl font-bold mb-2 glitch-wrapper">
                <i class="fab fa-tiktok text-tt-pink mr-2"></i>
                <span class="glitch" data-text="Recap Orderan">Recap Orderan</span>
            </h1>
            <p class="text-gray-400 text-sm mt-2">Catat closingan dengan asik & interaktif</p>
        </div>

        <div class="grid grid-cols-2 gap-4 mt-8">
            <div class="glass p-5 rounded-2xl border-l-4 border-tt-cyan text-center transition hover:scale-[1.02]">
                <p class="text-sm text-gray-400 mb-1">Total Pesanan Hari Ini</p>
                <p class="text-3xl font-bold text-white" id="statTotal">0</p>
            </div>
            <div class="glass p-5 rounded-2xl border-l-4 border-tt-pink text-center transition hover:scale-[1.02]">
                <p class="text-sm text-gray-400 mb-1">Total Omzet</p>
                <p class="text-3xl font-bold text-white" id="statOmzet">Rp 0</p>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Form Input -->
        <div class="md:col-span-1">
            <div class="glass rounded-2xl p-6 sticky top-4">
                <h2 class="text-xl font-semibold mb-6 border-b border-gray-700 pb-2">
                    <i class="fas fa-edit text-tt-cyan mr-2"></i> Input Pesanan
                </h2>
                
                <form id="orderForm" class="space-y-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1 ml-1">Kode / Nomor Pesanan</label>
                        <input type="text" id="orderId" placeholder="(Opsional)" autocomplete="off"
                            class="w-full bg-[#1a1a1a] border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-tt-cyan transition-colors">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1 ml-1">Nama Pembeli</label>
                        <input type="text" id="customer" required autocomplete="off"
                            class="w-full bg-[#1a1a1a] border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-tt-cyan transition-colors">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1 ml-1">Nama Produk</label>
                        <input type="text" id="product" required autocomplete="off"
                            class="w-full bg-[#1a1a1a] border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-tt-pink transition-colors">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1 ml-1">Harga (Rp)</label>
                        <input type="number" id="price" required autocomplete="off"
                            class="w-full bg-[#1a1a1a] border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-tt-cyan transition-colors">
                    </div>

                    <button type="submit" class="btn-glow w-full mt-4 py-3 bg-gradient-to-r from-tt-cyan to-tt-pink text-white font-bold rounded-xl transition-all flex items-center justify-center hover:opacity-90">
                        <i class="fas fa-paper-plane mr-2"></i> Simpan Pesanan
                    </button>
                </form>
            </div>
        </div>

        <!-- Daftar Pesanan -->
        <div class="md:col-span-2">
            <div class="glass rounded-2xl p-6 min-h-[500px] flex flex-col">
                <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-2">
                    <h2 class="text-xl font-semibold">
                        <i class="fas fa-list-ul text-tt-pink mr-2"></i> Riwayat Masuk
                    </h2>
                </div>
                
                <div id="orderList" class="flex-1 overflow-y-auto space-y-4 pr-2">
                    <!-- Data pesanan akan di-render di sini -->
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic (Murni Lokal) -->
    <script>
        // Ambil data dari Local Storage browser, jika kosong maka buat array baru
        let orders = JSON.parse(localStorage.getItem('tiktokOrders')) || [];
        
        const form = document.getElementById('orderForm');
        const list = document.getElementById('orderList');
        const statTotal = document.getElementById('statTotal');
        const statOmzet = document.getElementById('statOmzet');

        // Fungsi Format Uang
        const formatRupiah = (number) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);
        };

        // Render Antarmuka
        function renderUI() {
            // Update Statistik
            statTotal.innerText = orders.length;
            const totalOmzet = orders.reduce((sum, item) => sum + item.price, 0);
            statOmzet.innerText = formatRupiah(totalOmzet);

            // Update Daftar
            list.innerHTML = '';
            if(orders.length === 0) {
                list.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-gray-500 mt-20">
                        <i class="fas fa-ghost text-5xl mb-4 opacity-50 animate-bounce"></i>
                        <p>Belum ada orderan masuk</p>
                    </div>`;
                return;
            }

            orders.forEach((order) => {
                const item = document.createElement('div');
                // Tambahkan class animasi 'animate-slide-in'
                item.className = 'animate-slide-in bg-[#1a1a1a] rounded-xl p-4 flex items-center justify-between border-l-4 border-tt-cyan hover:border-tt-pink transition-all transform hover:-translate-y-1';
                
                item.innerHTML = `
                    <div class="flex-1">
                        <p class="font-bold text-white text-lg">${order.customer}</p>
                        <p class="text-[11px] text-tt-cyan font-mono mt-0.5"><i class="fas fa-hashtag text-[10px]"></i> ${order.orderId || 'Tanpa Kode'}</p>
                        <p class="text-sm text-gray-300 mt-1"><i class="fas fa-box text-xs mr-1"></i> ${order.product}</p>
                        <p class="text-xs text-gray-500 mt-1.5"><i class="far fa-clock"></i> ${order.time}</p>
                    </div>
                    <div class="text-right ml-4">
                        <p class="font-bold text-white text-lg tracking-wide">${formatRupiah(order.price)}</p>
                        <button onclick="deleteOrder(${order.id})" class="text-xs text-gray-500 mt-2 hover:text-tt-pink transition-colors">
                            <i class="fas fa-trash"></i> Hapus
                        </button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        // Tambah Pesanan
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const orderId = document.getElementById('orderId').value;
            const customer = document.getElementById('customer').value;
            const product = document.getElementById('product').value;
            const price = parseInt(document.getElementById('price').value);

            const newOrder = {
                id: Date.now(),
                orderId: orderId,
                customer,
                product,
                price,
                time: new Date().toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'})
            };

            // Masukkan ke urutan paling atas array
            orders.unshift(newOrder);
            
            // SIMPAN KE LOCAL STORAGE
            localStorage.setItem('tiktokOrders', JSON.stringify(orders));
            
            form.reset();
            document.getElementById('orderId').focus(); // Otomatis fokus ke input atas lagi
            
            renderUI();
            showToast('Asik! 1 Closingan Berhasil Dicatat 🔥', 'success');
        });

        // Hapus Pesanan
        window.deleteOrder = function(id) {
            orders = orders.filter(order => order.id !== id);
            
            // UPDATE LOCAL STORAGE SETELAH MENGHAPUS
            localStorage.setItem('tiktokOrders', JSON.stringify(orders));
            
            renderUI();
            showToast('Pesanan dihapus.', 'error');
        }

        // Fungsi Toast Notification (Muncul dari kanan bawah)
        function showToast(message, type) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const borderColor = type === 'success' ? 'border-tt-cyan' : 'border-tt-pink';
            const icon = type === 'success' ? '<i class="fas fa-check-circle text-tt-cyan text-lg"></i>' : '<i class="fas fa-trash text-tt-pink text-lg"></i>';
            
            toast.className = `toast border-l-4 ${borderColor}`;
            toast.innerHTML = `
                <div class="flex items-center gap-3">
                    ${icon}
                    <span class="text-sm font-medium text-gray-100">${message}</span>
                </div>
            `;
            
            container.appendChild(toast);
            
            // Hilangkan toast setelah 3 detik
            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Render awal
        renderUI();
    </script>
</body>
</html>
