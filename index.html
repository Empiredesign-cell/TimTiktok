<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Order Recap</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tt: { cyan: '#00f2fe', pink: '#fe0979', dark: '#121212' }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #0b0b0b;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at top left, rgba(0, 242, 254, 0.05), transparent 40%),
                radial-gradient(circle at bottom right, rgba(254, 9, 121, 0.05), transparent 40%);
            background-attachment: fixed;
        }
        .glass {
            background: rgba(25, 25, 25, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }
        
        /* 1. Efek Animasi Glitch Teks */
        .glitch-wrapper { position: relative; display: inline-block; }
        .glitch { position: relative; color: white; font-weight: bold; }
        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.8;
        }
        .glitch::before {
            left: 2px; text-shadow: -2px 0 #fe0979;
            animation: glitch-anim 2s infinite linear alternate-reverse;
        }
        .glitch::after {
            left: -2px; text-shadow: -2px 0 #00f2fe;
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim {
            0% { clip-path: inset(20% 0 80% 0); }
            20% { clip-path: inset(60% 0 10% 0); }
            40% { clip-path: inset(40% 0 50% 0); }
            60% { clip-path: inset(80% 0 5% 0); }
            80% { clip-path: inset(10% 0 70% 0); }
            100% { clip-path: inset(30% 0 20% 0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 60% 0); }
            20% { clip-path: inset(30% 0 20% 0); }
            40% { clip-path: inset(70% 0 10% 0); }
            60% { clip-path: inset(20% 0 50% 0); }
            80% { clip-path: inset(50% 0 30% 0); }
            100% { clip-path: inset(5% 0 80% 0); }
        }

        /* 2. Efek Pulse Glow untuk Tombol */
        .neon-border:hover, .btn-glow {
            box-shadow: 0 0 15px rgba(254, 9, 121, 0.5);
            animation: pulse-glow 2s infinite;
        }
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 15px rgba(254, 9, 121, 0.5); }
            50% { box-shadow: 0 0 25px rgba(0, 242, 254, 0.6); }
            100% { box-shadow: 0 0 15px rgba(254, 9, 121, 0.5); }
        }

        /* 3. Efek Slide-in */
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .animate-slide-in {
            animation: slideIn 0.4s ease-out forwards;
        }

        /* 4. Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        /* Toast Container */
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 50; display: flex; flex-direction: column; gap: 10px; }
        .toast {
            min-width: 250px; padding: 15px; border-radius: 8px; background: rgba(20,20,20,0.9);
            color: white; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); animation: slideIn 0.3s ease-out forwards;
        }
        .toast.hide { animation: fadeOut 0.3s ease-in forwards; }
        @keyframes fadeOut { to { opacity: 0; transform: translateX(50px); } }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Header & Stats -->
    <div class="w-full max-w-5xl mb-8">
        <div class="text-center mb-6">
            <h1 class="text-4xl md:text-5xl font-bold mb-2 glitch-wrapper">
                <i class="fab fa-tiktok text-tt-pink mr-2"></i>
                <span class="glitch" data-text="Recap Orderan">Recap Orderan</span>
            </h1>
            <p class="text-gray-400 text-sm mt-2">Catat closingan dengan asik & interaktif</p>
        </div>

        <div class="grid grid-cols-2 gap-4 mt-8">
            <div class="glass p-5 rounded-2xl border-l-4 border-tt-cyan text-center transition hover:scale-[1.02]">
                <p class="text-sm text-gray-400 mb-1">Total Pesanan</p>
                <p class="text-3xl font-bold text-white" id="statTotal">0</p>
            </div>
            <div class="glass p-5 rounded-2xl border-l-4 border-tt-pink text-center transition hover:scale-[1.02]">
                <p class="text-sm text-gray-400 mb-1">Total Omzet</p>
                <p class="text-3xl font-bold text-white" id="statOmzet">Rp 0</p>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Form Input -->
        <div class="md:col-span-1">
            <div class="glass rounded-2xl p-6 sticky top-4">
                <h2 class="text-xl font-semibold mb-6 border-b border-gray-700 pb-2">
                    <i class="fas fa-edit text-tt-cyan mr-2"></i> Input Pesanan
                </h2>
                
                <form id="orderForm" class="space-y-4">
                    <div>
                        <!-- BUG TERPENTING DIPERBAIKI: Tidak ada required disini agar bisa opsional -->
                        <input type="text" id="orderId" placeholder="Kode / Nomor Pesanan" autocomplete="off"
                            class="w-full bg-[#1a1a1a] border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-white transition-colors">
                    </div>
                    <div>
                        <input type="text" id="customer" required placeholder="Nama Pembeli" autocomplete="off"
                            class="w-full bg-[#1a1a1a] border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-tt-cyan transition-colors">
                    </div>
                    <div>
                        <input type="text" id="product" required placeholder="Nama Produk" autocomplete="off"
                            class="w-full bg-[#1a1a1a] border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-tt-pink transition-colors">
                    </div>
                    <div>
                        <input type="number" id="price" required placeholder="Harga (Rp)" autocomplete="off"
                            class="w-full bg-[#1a1a1a] border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-tt-cyan transition-colors">
                    </div>

                    <!-- Area Foto (Fitur Paste) -->
                    <div>
                        <div id="photoArea" class="w-full bg-[#1a1a1a] border-2 border-dashed border-gray-600 rounded-xl p-4 text-center cursor-pointer hover:border-tt-pink transition-colors relative overflow-hidden group min-h-[100px] flex flex-col items-center justify-center" onclick="document.getElementById('fileInput').click()">
                            
                            <div id="photoHint">
                                <i class="fas fa-image text-2xl text-gray-500 mb-2"></i>
                                <p class="text-xs text-gray-400">Klik pilih foto atau<br><strong class="text-white">Paste (Ctrl+V)</strong></p>
                            </div>

                            <img id="photoPreview" class="absolute inset-0 w-full h-full object-cover hidden" alt="Preview">
                            
                            <button type="button" id="removePhoto" class="absolute top-2 right-2 bg-red-500 text-white w-7 h-7 rounded-full hidden flex items-center justify-center hover:bg-red-600 z-10" onclick="event.stopPropagation(); resetPhoto()">
                                <i class="fas fa-times text-xs"></i>
                            </button>
                        </div>
                        <input type="file" id="fileInput" class="hidden" accept="image/*">
                    </div>

                    <button type="submit" id="submitBtn" class="btn-glow w-full py-3 bg-gradient-to-r from-tt-cyan to-tt-pink text-white font-bold rounded-xl transition-all flex items-center justify-center hover:opacity-90">
                        <i class="fas fa-check mr-2"></i> Simpan
                    </button>
                </form>
            </div>
        </div>

        <!-- Daftar Pesanan -->
        <div class="md:col-span-2">
            <div class="glass rounded-2xl p-6 min-h-[500px] flex flex-col">
                <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-2">
                    <h2 class="text-xl font-semibold">
                        <i class="fas fa-history text-tt-pink mr-2"></i> Riwayat Masuk
                    </h2>
                    <span id="loadingText" class="text-xs text-tt-cyan animate-pulse">Menghubungkan Database...</span>
                </div>
                
                <div id="orderList" class="flex-1 overflow-y-auto space-y-4 pr-2">
                    <!-- Data masuk kesini -->
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts Menggunakan Config Anda -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Konfigurasi dari Anda yang baru (TimTiktok)
        const firebaseConfig = {
            apiKey: "AIzaSyAqtIAECyYbixNLRYCA4PweI7ywTN7XGwg",
            authDomain: "timtiktok-5c94f.firebaseapp.com",
            projectId: "timtiktok-5c94f",
            storageBucket: "timtiktok-5c94f.firebasestorage.app",
            messagingSenderId: "700402084311",
            appId: "1:700402084311:web:1183a00358501ac8918392",
            measurementId: "G-FEBFDP0F1L"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // Kita simpan di folder 'artifacts' agar sesuai standar aplikasi
        const appId = "tiktok_recap_app"; 
        let userId = null;
        let orders = [];

        // State Foto
        window.currentImageData = null;

        // Login Anonim Otomatis
        async function initAuth() {
            try {
                await signInAnonymously(auth);
            } catch (error) {
                console.error("Gagal login:", error);
                document.getElementById('loadingText').innerText = "Autentikasi Anonim Gagal (Cek Firebase Console)";
                document.getElementById('loadingText').classList.replace('text-tt-cyan', 'text-red-500');
            }
        }
        initAuth();

        // Listener jika sudah berhasil Login
        onAuthStateChanged(auth, (user) => {
            if (user) {
                userId = user.uid;
                fetchData();
            }
        });

        function fetchData() {
            if (!userId) return;
            // Target lokasi database
            const ref = collection(db, 'artifacts', appId, 'users', userId, 'orders');
            
            onSnapshot(ref, (snapshot) => {
                orders = [];
                snapshot.forEach(doc => orders.push({ id: doc.id, ...doc.data() }));
                
                // Urutkan terbaru
                orders.sort((a, b) => b.timestamp - a.timestamp);
                
                document.getElementById('loadingText').classList.add('hidden');
                renderUI();
            }, (error) => {
                console.error("Gagal narik data:", error);
                document.getElementById('loadingText').innerText = "Gagal memuat Firestore. Cek Rules.";
                document.getElementById('loadingText').classList.replace('text-tt-cyan', 'text-red-500');
            });
        }

        // Fitur Toast
        function showToast(message, type) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const borderColor = type === 'success' ? 'border-tt-cyan' : 'border-tt-pink';
            const icon = type === 'success' ? '<i class="fas fa-check-circle text-tt-cyan text-lg"></i>' : '<i class="fas fa-info-circle text-tt-pink text-lg"></i>';
            
            toast.className = `toast border-l-4 ${borderColor}`;
            toast.innerHTML = `<div class="flex items-center gap-3">${icon}<span class="text-sm font-medium text-gray-100">${message}</span></div>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Logic Fitur Paste/Upload Foto
        document.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                    compressAndShowImage(items[i].getAsFile());
                }
            }
        });

        document.getElementById('fileInput').addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) compressAndShowImage(e.target.files[0]);
        });

        function compressAndShowImage(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 300; 
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    window.currentImageData = canvas.toDataURL('image/jpeg', 0.6); 
                    
                    document.getElementById('photoPreview').src = window.currentImageData;
                    document.getElementById('photoPreview').classList.remove('hidden');
                    document.getElementById('removePhoto').classList.remove('hidden');
                    document.getElementById('photoHint').classList.add('hidden');
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        window.resetPhoto = function() {
            window.currentImageData = null;
            document.getElementById('photoPreview').src = "";
            document.getElementById('photoPreview').classList.add('hidden');
            document.getElementById('removePhoto').classList.add('hidden');
            document.getElementById('photoHint').classList.remove('hidden');
            document.getElementById('fileInput').value = "";
        }

        // Simpan Data
        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!userId) return showToast("Sistem belum terhubung ke database.", 'error');

            const btn = document.getElementById('submitBtn');
            btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Menyimpan...`;
            btn.disabled = true;

            const newOrder = {
                orderId: document.getElementById('orderId').value || '',
                customer: document.getElementById('customer').value,
                product: document.getElementById('product').value,
                price: parseInt(document.getElementById('price').value),
                photo: window.currentImageData,
                timestamp: Date.now()
            };

            try {
                await addDoc(collection(db, 'artifacts', appId, 'users', userId, 'orders'), newOrder);
                e.target.reset();
                resetPhoto();
                document.getElementById('orderId').focus(); 
                showToast('Asik! 1 Closingan Berhasil Dicatat 🔥', 'success');
            } catch (err) {
                console.error(err);
                showToast("Gagal menyimpan. Pastikan rules Firebase disetup.", 'error');
            } finally {
                btn.innerHTML = `<i class="fas fa-check mr-2"></i> Simpan`;
                btn.disabled = false;
            }
        });

        // Hapus Data
        window.deleteOrder = async function(id) {
            if(!userId) return;
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'users', userId, 'orders', id));
                showToast('Pesanan dihapus.', 'error');
            } catch(e) {
                console.error("Gagal hapus", e);
            }
        }

        function renderUI() {
            document.getElementById('statTotal').innerText = orders.length;
            const totalOmzet = orders.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('statOmzet').innerText = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(totalOmzet);

            const listEl = document.getElementById('orderList');
            if(orders.length === 0) {
                listEl.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-gray-500 mt-20">
                        <i class="fas fa-ghost text-5xl mb-4 opacity-50 animate-bounce"></i>
                        <p>Belum ada orderan masuk</p>
                    </div>`;
                return;
            }

            listEl.innerHTML = orders.map(order => {
                const timeStr = new Date(order.timestamp).toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});
                const priceStr = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(order.price);
                
                const photoHTML = order.photo 
                    ? `<img src="${order.photo}" class="w-14 h-14 rounded-lg object-cover border border-gray-600 shrink-0">` 
                    : `<div class="w-14 h-14 rounded-lg bg-gray-800 border border-gray-600 flex items-center justify-center shrink-0"><i class="fas fa-image text-gray-600"></i></div>`;

                return `
                <div class="animate-slide-in bg-[#1a1a1a] rounded-xl p-3 flex items-center justify-between border-l-4 border-tt-cyan group hover:border-tt-pink transition-all transform hover:-translate-y-1">
                    <div class="flex items-center gap-3 overflow-hidden">
                        ${photoHTML}
                        <div class="min-w-0">
                            <p class="font-bold text-white truncate text-base md:text-lg">${order.customer}</p>
                            <p class="text-[11px] text-tt-cyan font-mono truncate mb-0.5"><i class="fas fa-hashtag text-[10px]"></i> ${order.orderId || 'Tanpa Kode'}</p>
                            <p class="text-xs md:text-sm text-gray-300 truncate"><i class="fas fa-box text-[10px] mr-1"></i> ${order.product}</p>
                            <p class="text-[10px] text-gray-500 mt-0.5"><i class="far fa-clock"></i> ${timeStr}</p>
                        </div>
                    </div>
                    <div class="flex flex-col items-end shrink-0 ml-4">
                        <span class="font-bold text-white text-base md:text-lg tracking-wide">${priceStr}</span>
                        <button onclick="deleteOrder('${order.id}')" class="text-xs text-gray-500 mt-2 opacity-0 group-hover:opacity-100 transition-all hover:text-tt-pink">
                            <i class="fas fa-trash"></i> Hapus
                        </button>
                    </div>
                </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
