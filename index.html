<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Order Recap</title>
    <link rel="icon" type="image/x-icon" href="tim.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tt: { cyan: '#00f2fe', pink: '#fe0979', dark: '#121212' }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #0b0b0b;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at top left, rgba(0, 242, 254, 0.05), transparent 40%),
                radial-gradient(circle at bottom right, rgba(254, 9, 121, 0.05), transparent 40%);
            background-attachment: fixed;
        }
        .glass {
            background: rgba(25, 25, 25, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }
        
        /* Efek Animasi Glitch Teks */
        .glitch-wrapper { position: relative; display: inline-block; }
        .glitch { position: relative; color: white; font-weight: bold; }
        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.8;
        }
        .glitch::before { left: 2px; text-shadow: -2px 0 #fe0979; animation: glitch-anim 2s infinite linear alternate-reverse; }
        .glitch::after { left: -2px; text-shadow: -2px 0 #00f2fe; animation: glitch-anim-2 3s infinite linear alternate-reverse; }
        @keyframes glitch-anim { 0% { clip-path: inset(20% 0 80% 0); } 20% { clip-path: inset(60% 0 10% 0); } 40% { clip-path: inset(40% 0 50% 0); } 60% { clip-path: inset(80% 0 5% 0); } 80% { clip-path: inset(10% 0 70% 0); } 100% { clip-path: inset(30% 0 20% 0); } }
        @keyframes glitch-anim-2 { 0% { clip-path: inset(10% 0 60% 0); } 20% { clip-path: inset(30% 0 20% 0); } 40% { clip-path: inset(70% 0 10% 0); } 60% { clip-path: inset(20% 0 50% 0); } 80% { clip-path: inset(50% 0 30% 0); } 100% { clip-path: inset(5% 0 80% 0); } }

        /* Efek Pulse Glow untuk Tombol */
        .neon-border:hover, .btn-glow { box-shadow: 0 0 15px rgba(254, 9, 121, 0.5); animation: pulse-glow 2s infinite; }
        @keyframes pulse-glow { 0% { box-shadow: 0 0 15px rgba(254, 9, 121, 0.5); } 50% { box-shadow: 0 0 25px rgba(0, 242, 254, 0.6); } 100% { box-shadow: 0 0 15px rgba(254, 9, 121, 0.5); } }

        /* Efek Slide-in */
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        /* Toast Container */
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 50; display: flex; flex-direction: column; gap: 10px; }
        .toast { min-width: 250px; padding: 15px; border-radius: 8px; background: rgba(20,20,20,0.9); color: white; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 5px 15px rgba(0,0,0,0.5); animation: slideIn 0.3s ease-out forwards; }
        .toast.hide { animation: fadeOut 0.3s ease-in forwards; }
        @keyframes fadeOut { to { opacity: 0; transform: translateX(50px); } }
        
        /* Ubah warna icon kalender di input date agar putih */
        ::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <div id="toast-container"></div>

    <!-- Header -->
    <div class="w-full max-w-5xl mb-6">
        <div class="text-center">
            <h1 class="text-4xl md:text-5xl font-bold mb-2 glitch-wrapper">
                <i class="fab fa-tiktok text-tt-pink mr-2"></i>
                <span class="glitch" data-text="Recap Orderan">Recap Orderan</span>
            </h1>
            <p class="text-gray-400 text-sm mt-2">Catat closingan dengan asik & interaktif</p>
        </div>
    </div>

    <!-- Filter Bar (Fitur Baru) -->
    <div class="w-full max-w-5xl mb-4 flex flex-col md:flex-row justify-between items-center gap-4 bg-[#1a1a1a] border border-gray-800 rounded-2xl p-4">
        <div class="flex items-center gap-2">
            <i class="fas fa-chart-pie text-tt-cyan text-xl"></i>
            <span class="font-bold">Dashboard Statistik</span>
        </div>
        
        <div class="flex flex-col sm:flex-row items-center gap-3">
            <select id="periodFilter" class="bg-[#2a2a2a] border border-gray-700 text-white rounded-lg px-4 py-2 outline-none focus:border-tt-pink transition-colors text-sm w-full sm:w-auto cursor-pointer">
                <option value="this_month" selected>Bulan Ini</option>
                <option value="last_month">Bulan Lalu</option>
                <option value="today">Hari Ini</option>
                <option value="7days">7 Hari Terakhir</option>
                <option value="all">Semua Waktu</option>
                <option value="custom">Tentukan Tanggal...</option>
            </select>

            <div id="customDateContainer" class="hidden items-center gap-2 w-full sm:w-auto animate-slide-in">
                <input type="date" id="startDate" class="bg-[#2a2a2a] border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-white outline-none">
                <span class="text-gray-500 text-xs">s/d</span>
                <input type="date" id="endDate" class="bg-[#2a2a2a] border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-white outline-none">
                <button id="applyCustomDate" type="button" class="bg-tt-cyan text-black px-3 py-1.5 rounded-lg text-sm font-bold hover:bg-white transition-colors">Cari</button>
            </div>
        </div>
    </div>

    <!-- Stats -->
    <div class="w-full max-w-5xl grid grid-cols-2 gap-4 mb-8">
        <div class="glass p-5 rounded-2xl border-l-4 border-tt-cyan text-center transition hover:scale-[1.02]">
            <p class="text-sm text-gray-400 mb-1" id="labelStatTotal">Total Pesanan</p>
            <p class="text-3xl font-bold text-white" id="statTotal">0</p>
        </div>
        <div class="glass p-5 rounded-2xl border-l-4 border-tt-pink text-center transition hover:scale-[1.02]">
            <p class="text-sm text-gray-400 mb-1" id="labelStatOmzet">Total Omzet</p>
            <p class="text-3xl font-bold text-white" id="statOmzet">Rp 0</p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Form Input -->
        <div class="md:col-span-1">
            <div class="glass rounded-2xl p-6 sticky top-4">
                <h2 class="text-xl font-semibold mb-6 border-b border-gray-700 pb-2 flex items-center justify-between">
                    <span><i class="fas fa-edit text-tt-cyan mr-2" id="formIcon"></i> <span id="formTitle">Input Pesanan</span></span>
                </h2>
                
                <form id="orderForm" class="space-y-4">
                    <div>
                        <input type="date" id="orderDate" required title="Tanggal Order"
                            class="w-full bg-[#1a1a1a] border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-white transition-colors text-white">
                    </div>
                    <div>
                        <input type="text" id="orderId" placeholder="Kode / Nomor Pesanan (Opsional)" autocomplete="off"
                            class="w-full bg-[#1a1a1a] border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-tt-cyan transition-colors">
                    </div>
                    <div>
                        <input type="text" id="customer" required placeholder="Nama Pembeli" autocomplete="off"
                            class="w-full bg-[#1a1a1a] border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-tt-pink transition-colors">
                    </div>
                    <div>
                        <input type="text" id="product" required placeholder="Nama Produk" autocomplete="off"
                            class="w-full bg-[#1a1a1a] border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-tt-cyan transition-colors">
                    </div>
                    <div>
                        <input type="number" id="price" required placeholder="Harga (Rp)" autocomplete="off"
                            class="w-full bg-[#1a1a1a] border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-tt-pink transition-colors">
                    </div>

                    <!-- Area Foto (Fitur Paste) -->
                    <div>
                        <div id="photoArea" class="w-full bg-[#1a1a1a] border-2 border-dashed border-gray-600 rounded-xl p-4 text-center cursor-pointer hover:border-tt-cyan transition-colors relative overflow-hidden group min-h-[100px] flex flex-col items-center justify-center" onclick="document.getElementById('fileInput').click()">
                            <div id="photoHint">
                                <i class="fas fa-image text-2xl text-gray-500 mb-2"></i>
                                <p class="text-xs text-gray-400">Klik pilih foto atau<br><strong class="text-white">Paste (Ctrl+V)</strong></p>
                            </div>
                            <img id="photoPreview" class="absolute inset-0 w-full h-full object-cover hidden" alt="Preview">
                            <button type="button" id="removePhoto" class="absolute top-2 right-2 bg-red-500 text-white w-7 h-7 rounded-full hidden flex items-center justify-center hover:bg-red-600 z-10" onclick="event.stopPropagation(); resetPhoto()">
                                <i class="fas fa-times text-xs"></i>
                            </button>
                        </div>
                        <input type="file" id="fileInput" class="hidden" accept="image/*">
                    </div>

                    <div class="flex gap-2">
                        <button type="submit" id="submitBtn" class="btn-glow flex-1 py-3 bg-gradient-to-r from-tt-cyan to-tt-pink text-white font-bold rounded-xl transition-all flex items-center justify-center hover:opacity-90">
                            <i class="fas fa-check mr-2" id="submitIcon"></i> <span id="submitText">Simpan</span>
                        </button>
                        <button type="button" id="cancelEditBtn" onclick="cancelEdit()" class="hidden py-3 px-4 bg-gray-700 hover:bg-gray-600 text-white font-bold rounded-xl transition-all">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Daftar Pesanan -->
        <div class="md:col-span-2">
            <div class="glass rounded-2xl p-6 min-h-[500px] flex flex-col">
                <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-2">
                    <h2 class="text-xl font-semibold">
                        <i class="fas fa-history text-tt-pink mr-2"></i> Riwayat Masuk
                    </h2>
                    <span id="loadingText" class="text-xs text-tt-cyan animate-pulse">Menghubungkan Database...</span>
                </div>
                
                <div id="orderList" class="flex-1 overflow-y-auto space-y-4 pr-2">
                    <!-- Data masuk kesini -->
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Config TimTiktok
        const firebaseConfig = {
            apiKey: "AIzaSyAqtIAECyYbixNLRYCA4PweI7ywTN7XGwg",
            authDomain: "timtiktok-5c94f.firebaseapp.com",
            projectId: "timtiktok-5c94f",
            storageBucket: "timtiktok-5c94f.firebasestorage.app",
            messagingSenderId: "700402084311",
            appId: "1:700402084311:web:1183a00358501ac8918392",
            measurementId: "G-FEBFDP0F1L"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const appId = "tiktok_recap_app"; 
        let userId = null;
        let orders = [];

        // State Edit, Foto & Filter
        let editMode = false;
        let currentEditId = null;
        window.currentImageData = null;
        let currentFilter = 'this_month'; // Default tampilan: Bulan Ini

        // Inisialisasi Tanggal
        document.getElementById('orderDate').valueAsDate = new Date();
        document.getElementById('startDate').valueAsDate = new Date();
        document.getElementById('endDate').valueAsDate = new Date();

        // Autentikasi
        async function initAuth() {
            try {
                await signInAnonymously(auth);
            } catch (error) {
                console.error("Gagal login:", error);
                document.getElementById('loadingText').innerText = "Autentikasi Anonim Gagal";
                document.getElementById('loadingText').classList.replace('text-tt-cyan', 'text-red-500');
            }
        }
        initAuth();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                userId = user.uid;
                fetchData();
            }
        });

        // Ambil Data Firestore (Semua Data)
        function fetchData() {
            if (!userId) return;
            const ref = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
            
            onSnapshot(ref, (snapshot) => {
                orders = [];
                snapshot.forEach(doc => orders.push({ id: doc.id, ...doc.data() }));
                
                // Urutkan berdasarkan waktu input terbaru
                orders.sort((a, b) => b.timestamp - a.timestamp);
                
                document.getElementById('loadingText').classList.add('hidden');
                renderUI(); // Render akan otomatis memfilter sesuai pilihan dropdown
            });
        }

        // --- FITUR FILTER LOGIC ---
        document.getElementById('periodFilter').addEventListener('change', (e) => {
            currentFilter = e.target.value;
            const customDateContainer = document.getElementById('customDateContainer');
            
            // Update Label Statistik biar enak dibaca
            const labelMap = {
                'this_month': 'Bulan Ini', 'last_month': 'Bulan Lalu', 'today': 'Hari Ini', '7days': '7 Hari Terakhir', 'all': 'Semua Waktu', 'custom': 'Periode Custom'
            };
            document.getElementById('labelStatTotal').innerText = `Total Pesanan (${labelMap[currentFilter]})`;
            document.getElementById('labelStatOmzet').innerText = `Total Omzet (${labelMap[currentFilter]})`;

            if (currentFilter === 'custom') {
                customDateContainer.classList.remove('hidden');
                customDateContainer.classList.add('flex');
            } else {
                customDateContainer.classList.add('hidden');
                customDateContainer.classList.remove('flex');
                renderUI();
            }
        });

        document.getElementById('applyCustomDate').addEventListener('click', () => {
            renderUI();
        });

        function getFilteredOrders() {
            if (currentFilter === 'all') return orders;

            const getLocalYYYYMMDD = (d) => {
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            };

            const todayObj = new Date();
            const todayStr = getLocalYYYYMMDD(todayObj);
            const thisMonthStr = todayStr.substring(0, 7); // Format YYYY-MM

            const lastMonthObj = new Date(todayObj.getFullYear(), todayObj.getMonth() - 1, 1);
            const lastMonthStr = getLocalYYYYMMDD(lastMonthObj).substring(0, 7);

            return orders.filter(order => {
                const dateStr = order.orderDate;
                if (!dateStr) return true; // Skip filter jika data jadul gak punya tanggal

                if (currentFilter === 'today') {
                    return dateStr === todayStr;
                } else if (currentFilter === 'this_month') {
                    return dateStr.substring(0, 7) === thisMonthStr;
                } else if (currentFilter === 'last_month') {
                    return dateStr.substring(0, 7) === lastMonthStr;
                } else if (currentFilter === '7days') {
                    const sevenDaysAgoObj = new Date();
                    sevenDaysAgoObj.setDate(sevenDaysAgoObj.getDate() - 6);
                    const sevenDaysAgoStr = getLocalYYYYMMDD(sevenDaysAgoObj);
                    return dateStr >= sevenDaysAgoStr && dateStr <= todayStr;
                } else if (currentFilter === 'custom') {
                    const start = document.getElementById('startDate').value;
                    const end = document.getElementById('endDate').value;
                    if (!start || !end) return true;
                    return dateStr >= start && dateStr <= end;
                }
                return true;
            });
        }

        // Render UI (Membaca dari Data yang Difilter)
        function renderUI() {
            // 1. Ambil data yang sudah difilter
            const filteredOrders = getFilteredOrders();

            // 2. Hitung Statistik khusus data tsb
            document.getElementById('statTotal').innerText = filteredOrders.length;
            const totalOmzet = filteredOrders.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('statOmzet').innerText = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(totalOmzet);

            // 3. Tampilkan list
            const listEl = document.getElementById('orderList');
            if(filteredOrders.length === 0) {
                listEl.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-gray-500 mt-20">
                        <i class="fas fa-ghost text-5xl mb-4 opacity-50 animate-bounce"></i>
                        <p>Belum ada data di periode ini</p>
                    </div>`;
                return;
            }

            listEl.innerHTML = filteredOrders.map(order => {
                const timeStr = new Date(order.timestamp).toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});
                const dateObj = new Date(order.orderDate);
                const dateStr = !isNaN(dateObj) ? dateObj.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) : 'Tanpa Tanggal';
                const priceStr = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(order.price);
                
                const photoHTML = order.photo 
                    ? `<img src="${order.photo}" class="w-14 h-14 rounded-lg object-cover border border-gray-600 shrink-0">` 
                    : `<div class="w-14 h-14 rounded-lg bg-gray-800 border border-gray-600 flex items-center justify-center shrink-0"><i class="fas fa-image text-gray-600"></i></div>`;

                return `
                <div class="animate-slide-in bg-[#1a1a1a] rounded-xl p-3 flex items-center justify-between border-l-4 border-tt-cyan group hover:border-tt-pink transition-all transform hover:-translate-y-1">
                    <div class="flex items-center gap-3 overflow-hidden">
                        ${photoHTML}
                        <div class="min-w-0">
                            <p class="font-bold text-white truncate text-base md:text-lg">${order.customer}</p>
                            <p class="text-[11px] text-tt-cyan font-mono truncate mb-0.5"><i class="fas fa-hashtag text-[10px]"></i> ${order.orderId || 'Tanpa Kode'}</p>
                            <p class="text-xs md:text-sm text-gray-300 truncate"><i class="fas fa-box text-[10px] mr-1"></i> ${order.product}</p>
                            <p class="text-[10px] text-gray-500 mt-0.5">
                                <i class="far fa-calendar-alt text-[9px] mr-0.5"></i> ${dateStr} &nbsp; 
                                <i class="far fa-clock text-[9px] mr-0.5"></i> ${timeStr}
                            </p>
                        </div>
                    </div>
                    <div class="flex flex-col items-end shrink-0 ml-4">
                        <span class="font-bold text-white text-base md:text-lg tracking-wide mb-1">${priceStr}</span>
                        <div class="flex gap-3 opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="editOrder('${order.id}')" class="text-xs text-tt-cyan hover:text-white transition-colors" title="Edit Pesanan">
                                <i class="fas fa-pen"></i> Edit
                            </button>
                            <button onclick="deleteOrder('${order.id}')" class="text-xs text-red-500 hover:text-tt-pink transition-colors" title="Hapus Pesanan">
                                <i class="fas fa-trash"></i> Hapus
                            </button>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        // --- LOGIC LAINNYA (EDIT, SAVE, DELETE, TOAST, FOTO) ---
        function showToast(message, type) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const borderColor = type === 'success' ? 'border-tt-cyan' : 'border-tt-pink';
            const icon = type === 'success' ? '<i class="fas fa-check-circle text-tt-cyan text-lg"></i>' : '<i class="fas fa-info-circle text-tt-pink text-lg"></i>';
            
            toast.className = `toast border-l-4 ${borderColor}`;
            toast.innerHTML = `<div class="flex items-center gap-3">${icon}<span class="text-sm font-medium text-gray-100">${message}</span></div>`;
            
            container.appendChild(toast);
            setTimeout(() => { toast.classList.add('hide'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        document.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) compressAndShowImage(items[i].getAsFile());
            }
        });

        document.getElementById('fileInput').addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) compressAndShowImage(e.target.files[0]);
        });

        function compressAndShowImage(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 300; 
                    let width = img.width; let height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                    window.currentImageData = canvas.toDataURL('image/jpeg', 0.6); 
                    
                    document.getElementById('photoPreview').src = window.currentImageData;
                    document.getElementById('photoPreview').classList.remove('hidden');
                    document.getElementById('removePhoto').classList.remove('hidden');
                    document.getElementById('photoHint').classList.add('hidden');
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        window.resetPhoto = function() {
            window.currentImageData = null;
            document.getElementById('photoPreview').src = "";
            document.getElementById('photoPreview').classList.add('hidden');
            document.getElementById('removePhoto').classList.add('hidden');
            document.getElementById('photoHint').classList.remove('hidden');
            document.getElementById('fileInput').value = "";
        }

        window.editOrder = function(id) {
            const order = orders.find(o => o.id === id);
            if(!order) return;
            editMode = true; currentEditId = id;

            document.getElementById('orderDate').value = order.orderDate || new Date().toISOString().split('T')[0];
            document.getElementById('orderId').value = order.orderId || '';
            document.getElementById('customer').value = order.customer || '';
            document.getElementById('product').value = order.product || '';
            document.getElementById('price').value = order.price || '';

            if(order.photo) {
                window.currentImageData = order.photo;
                document.getElementById('photoPreview').src = order.photo;
                document.getElementById('photoPreview').classList.remove('hidden');
                document.getElementById('removePhoto').classList.remove('hidden');
                document.getElementById('photoHint').classList.add('hidden');
            } else { resetPhoto(); }

            document.getElementById('formTitle').innerText = 'Edit Pesanan';
            document.getElementById('formIcon').className = 'fas fa-pen text-green-400 mr-2';
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.classList.remove('from-tt-cyan', 'to-tt-pink');
            submitBtn.classList.add('from-green-500', 'to-emerald-600');
            
            document.getElementById('submitText').innerText = 'Update';
            document.getElementById('submitIcon').className = 'fas fa-save mr-2';
            document.getElementById('cancelEditBtn').classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.cancelEdit = function() {
            editMode = false; currentEditId = null;
            document.getElementById('orderForm').reset();
            document.getElementById('orderDate').valueAsDate = new Date();
            resetPhoto();

            document.getElementById('formTitle').innerText = 'Input Pesanan';
            document.getElementById('formIcon').className = 'fas fa-edit text-tt-cyan mr-2';
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.classList.remove('from-green-500', 'to-emerald-600');
            submitBtn.classList.add('from-tt-cyan', 'to-tt-pink');
            
            document.getElementById('submitText').innerText = 'Simpan';
            document.getElementById('submitIcon').className = 'fas fa-check mr-2';
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!userId) return showToast("Sistem belum terhubung ke database.", 'error');

            const btn = document.getElementById('submitBtn');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> ${editMode ? 'Mengupdate...' : 'Menyimpan...'}`;
            btn.disabled = true;

            const orderData = {
                orderDate: document.getElementById('orderDate').value,
                orderId: document.getElementById('orderId').value || '',
                customer: document.getElementById('customer').value,
                product: document.getElementById('product').value,
                price: parseInt(document.getElementById('price').value),
                photo: window.currentImageData
            };

            try {
                if(editMode) {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'orders', currentEditId), orderData);
                    showToast('Asik! Data berhasil diupdate 📝', 'success');
                    cancelEdit();
                } else {
                    orderData.timestamp = Date.now();
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'orders'), orderData);
                    e.target.reset();
                    document.getElementById('orderDate').valueAsDate = new Date(); 
                    resetPhoto();
                    showToast('Asik! 1 Closingan Berhasil Dicatat 🔥', 'success');
                }
                document.getElementById('orderId').focus(); 
            } catch (err) {
                console.error(err);
                showToast("Gagal memproses data. Cek koneksi.", 'error');
            } finally {
                btn.innerHTML = originalHTML;
                btn.disabled = false;
            }
        });

        window.deleteOrder = async function(id) {
            if(!userId) return;
            if(editMode && currentEditId === id) cancelEdit();
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'orders', id));
                showToast('Pesanan dihapus.', 'error');
            } catch(e) { console.error("Gagal hapus", e); }
        }
    </script>
</body>
</html>
